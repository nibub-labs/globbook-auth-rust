[package]
name = "globbook-auth"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
description = "Official Rust SDK for Sign in with Globbook (OAuth 2.0)"
license = "MIT"
repository = "https://github.com/nibub-labs/globbook-auth-rust"
documentation = "https://docs.rs/globbook-auth"
readme = "README.md"
keywords = ["globbook", "oauth", "oauth2", "authentication", "login"]
categories = ["authentication", "api-bindings"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
